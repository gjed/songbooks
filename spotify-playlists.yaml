# Spotify playlist manifest — the contract between the two phases.
#
# `resolve` (local, interactive) pins a track URI for every song.
# `sync` (CI, unattended) pushes those URIs and nothing else.
#
# Track values are one of three states:
#   ""                       not yet resolved — a search candidate
#   spotify:track:<id>       pinned to this recording
#   null                     deliberately not on Spotify — stop asking
#
# Track keys are .cho filename stems, in file order.
# Regenerate entries with: make spotify-resolve
