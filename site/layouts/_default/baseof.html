<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}" dir="{{ .Site.Language.Direction | default "ltr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ i18n "site_title" }}{{ else }}{{ .Title }} — {{ i18n "site_title" }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.blurb }}{{ . }}{{ else }}{{ i18n "site_tagline" }}{{ end }}">
  {{ with .OutputFormats.Get "html" }}<link rel="canonical" href="{{ .Permalink }}">{{ end }}
  {{ range .Translations }}
  <link rel="alternate" hreflang="{{ .Site.Language.Locale }}" href="{{ .Permalink }}">
  {{- end }}
  {{ partial "theme-init.html" . }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Special+Elite&display=swap" rel="stylesheet">
  {{ partial "head-css.html" . }}
</head>
<body>
  <a class="skip" href="#main">{{ i18n "skip_to_content" }}</a>
  <div class="sheet">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  {{ partial "head-js.html" . }}
</body>
</html>
