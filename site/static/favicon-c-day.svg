    Favicon mark: a real Special Elite glyph outline on the rounded
    slab tile. Special Elite is the site's display font; the letter
    matches the masthead wordmark for the language (S = Songbooks,
    C = Canzonieri).

    The outline is BAKED into path coordinates rather than set with
    <text font-family="Special Elite">, because a font-name
    reference would render as a fallback face anywhere the font is
    not installed. Ink fills 74% of the tile — tested as the ceiling
    before the glyph crowds the rounded corners.

    Explicit day-theme variant. Referenced only by
    initTheme() in assets/js/site.js, which swaps to it when the
    visitor has made an explicit theme choice that an SVG media
    query cannot observe. The default document reference is the
    auto file, which follows prefers-color-scheme with no JS.
  -->
