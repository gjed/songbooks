baseURL = "https://gjed.github.io/songbooks/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
enableEmoji = false

# Most content is machine-generated (scripts/site-data.py) under
# site/content/songbooks/; a few standalone pages (e.g. credits.*.md) are
# hand-authored. Either way there are no taxonomies, no feeds, no term pages.
disableKinds = ["rss", "taxonomy", "term"]

# All user-visible chrome lives in i18n/*.toml. These titles are only ever
# used as a fallback by Hugo internals.
[languages]
  [languages.en]
    locale = "en"
    label = "English"
    direction = "ltr"
    title = "Songbooks"
    weight = 1
  [languages.it]
    locale = "it"
    label = "Italiano"
    direction = "ltr"
    title = "Canzonieri"
    weight = 2

[params]
  repo = "https://github.com/gjed/songbooks"
  # Fallback release label. The generator normally puts `version:` in each
  # page's front matter; the footer picks that up automatically.
  version = ""

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true

[minify]
  [minify.tdewolff.html]
    keepQuotes = true
    # Song lyrics carry meaning in their whitespace: scripts/site-data.py
    # emits songline text with single interior spaces as real wrap points
    # (see chordpro.css's songline section). Without this the minifier
    # trims/collapses inline-element whitespace and can eat those spaces.
    keepWhitespace = true

[caches]
  [caches.images]
    maxAge = "720h"
