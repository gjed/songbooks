blurb: Rareș, cantautore di Marghera — Curriculum Vitae, Folk_2021, Sincero!

description:
  it: >-
    Canzoni di Rareș, cantautore di Marghera (VE), tratte dagli album
    *Curriculum Vitae*, *Folk_2021* e *Sincero!*, più il duetto *Agosto*
    con faccianuvola. Ukulele, accordi in notazione inglese.
  en: >-
    Songs by Rareș, a singer-songwriter from Marghera (VE, Italy), drawn from
    the albums *Curriculum Vitae*, *Folk_2021*, and *Sincero!*, plus the
    duet *Agosto* with faccianuvola. Ukulele, English chord notation.

