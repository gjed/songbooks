# Songbook metadata + print layout. Human-authored.
# spotify.yaml is machine-written (spotify_playlists.py) and stays separate.
# The cover/back values below spell out the historic HBS defaults that this
# songbook previously inherited implicitly (via the 00-cover.cho marker).
slug: hbs-ita
title: HBS Songbook — Italiano
language: it        # primary language — drives the printed intro page (#36)
notation: latin     # chord names used in the .cho files (DO RE MI …)

blurb: Italian songs, with cover and chord chart

description: >-
  Italian songs for the Hike Song Book (HBS), for group singing on the trail
  or around the fire. Includes cover and ukulele chord chart.

# Print layout — presence of `cover:` is what enables cover pages.
cover:
  title: HBS Songbook
  strip_top: strip-top.png
  strip_bottom: strip-bottom.png
  logo: cover-uke.png
  logo_width: 480
  logo_offset: -20

back:
  image: cover-celtic.jpeg
  image_width: 240
