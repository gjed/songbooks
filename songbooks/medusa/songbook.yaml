# it is the band itself -- the duo with eyes projected over their faces,
# which is Medusa's own motif, the gaze. Same green field and rules as
# the cover so the two read as one sleeve.
back:
  background: "#52FF71"
  image: images/99-back-cover-art.jpg
  image_width: 400
  caption: "queen of saba  ·  medusa  ·  2023"
  caption_font: Courier-Bold
  caption_size: 13
  caption_color: "#7A0A5C"
  caption_y: 83.35   # matches the cover subtitle's baseline (MARGIN + 55)
  spotify: false
  rules:
