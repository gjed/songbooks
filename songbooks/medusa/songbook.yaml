    - { color: "#7A0A5C", y: 791, height: 7 }
    - { color: "#F237CE", y: 777, height: 7 }
    - { color: "#F237CE", y: 58, height: 7 }
    - { color: "#7A0A5C", y: 44, height: 7 }
    - { color: "#F237CE", y: 30, height: 7 }
