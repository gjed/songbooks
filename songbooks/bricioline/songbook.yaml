slug: bricioline
title: Bricioline
artist: Queen of Saba
language: it        # primary language — drives the printed intro page (#36)
notation: common    # chord names used in the .cho files (C D E …)

blurb: Queen of Saba — Italian children's music

description:
  it: >-
    Songbook di *Bricioline (Canzoni per chi cresce)* dei Queen of Saba, band
    indie italiana di Venezia. Brani fantasiosi e giocosi, pensati per cantare
    insieme ai più piccoli. Ukulele, accordi in notazione inglese.
  en: >-
    Songbook for *Bricioline (Canzoni per chi cresce)* — "songs for those who
    grow up" — by the Venice-based Italian indie band Queen of Saba. Whimsical,
    imaginative pieces built for singing together with the very young. Ukulele,
    English chord notation.

