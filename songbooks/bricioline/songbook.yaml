    - { color: "#92C7C8", y: 790, height: 9 }
    - { color: "#3F7779", y: 777, height: 9 }
    - { color: "#D6A8A1", y: 764, height: 9 }
    - { color: "#92C7C8", y: 56, height: 9 }
    - { color: "#3F7779", y: 43, height: 9 }
