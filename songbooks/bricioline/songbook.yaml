# Presence of `intro:` is what enables the intro page.
intro:
  title: bricioline
  title_color: "#3F7779"
  # Printed page: only the locale matching `language:` above is rendered.
  description:
    it:
      - >-
        Bricioline è l'album dei Queen of Saba, il duo veneto di Fabio Santi e
        Lorenzo Battistel. Fiati, ukulele e cori costruiscono un immaginario
        fiabesco in cui mondo adulto e infantile si intrecciano: l'infanzia come
        terra sconfinata, dove niente è rigido e definito e la gioia non è ancora
        soffocata dalle logiche del mondo dei grandi.
      - >-
        Tra smorfie allo specchio, limoni con la scorza, rizomi e rifugi degli
        animali, le canzoni celebrano la cura, il consenso e la famiglia che ci
        scegliamo — briciole lasciate lungo il sentiero per ricordare dove
        tornare, e dove una mano stringerà la tua.
      - Un'utopia gentile che può diventare realtà.
    en:
      - >-
        Bricioline is the album by Queen of Saba, the duo from the Veneto made
        up of Fabio Santi and Lorenzo Battistel. Horns, ukulele and choirs build
        a fairy-tale world where grown-up and childhood life intertwine:
        childhood as boundless country, where nothing is rigid or settled and joy
        has not yet been smothered by the logic of the adult world.
      - >-
        Among faces pulled in the mirror, lemons eaten with the peel, rhizomes
        and animal dens, these songs celebrate care, consent and the family we
        choose for ourselves — crumbs dropped along the path to remember the way
        back, and where a hand will hold yours.
      - A gentle utopia that could yet come true.
  description_color: "#3F7779"
