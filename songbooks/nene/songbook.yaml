# Songbook metadata + print layout. Human-authored.
# spotify.yaml is machine-written (spotify_playlists.py) and stays separate.
slug: nene
title: Nené
artist: Nené
language: it        # primary language — drives the printed intro page (#36)
notation: common    # chord names used in the .cho files (C D E …)

blurb: Homemade Italian singles, phone-recorded

description: >-
  Songbook for **Nené** — homemade singles written and recorded on a
  phone, in Italian. Ukulele, English chord notation.

# Print layout — presence of `cover:` is what enables cover pages.
cover:
  title: Nené
  title_font: Courier-Bold
  title_size: 30
  title_color: "#1B1B1B"
  logo: cover-nene.png
  logo_width: 480
  logo_offset: -30
  subtitle: "songbook  ·  ukulele"
  subtitle_font: Courier-Bold
  subtitle_size: 13
  subtitle_color: "#1B1B1B"

# Presence of `intro:` is what enables the intro page.
intro:
  title: Nené
  title_color: "#1B1B1B"
  description: >-
    I Nené sono una giovane band veronese, composta da quattro musicisti
    under 25 uniti dalla passione per la musica.
  description_color: "#1B1B1B"
  spotify_color: "#1B1B1B"
  spotify_label: Ascolta la playlist su Spotify
  links:
    - label: Ascolta l'artista su Spotify
      url: https://open.spotify.com/artist/6FM21G1vZSSyhmbcu3WHyG?si=SfF39HzGQsSqB1BHu7zoVg
      color: "#1B1B1B"

back:
  image: back-nene.png
  image_width: 400
  caption: "Nené  ·  singles"
  caption_font: Courier
  caption_size: 10
  caption_color: "#1B1B1B"
  spotify: false
