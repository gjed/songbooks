# Songbook metadata + print layout. Human-authored.
# spotify.yaml is machine-written (spotify_playlists.py) and stays separate.
slug: caprera
title: Caprera
language: it        # primary language — drives the printed pages
notation: common    # chord names used in the .cho files (C D E …)

blurb:
  it: Centro Velico Caprera — canzoni da cantare insieme in terrazza
  en: Centro Velico Caprera — songs to sing together on the terrace

description:
  it: >-
    Canzoniere del Centro Velico Caprera: canzoni da cantare insieme in
    terrazza. Cantautori italiani, un po' di pop e rock, qualche pezzo in
    inglese. Ukulele, accordi in notazione inglese.
  en: >-
    Songbook of the Centro Velico Caprera sailing school: songs to sing
    together on the terrace. Italian singer-songwriters, some pop and rock, a
    few songs in English. Ukulele, English chord notation.

# Print layout — presence of `cover:` is what enables cover pages.
# Palette sampled from the CVC burgee painted on the hut in the cover art:
# navy #1C346E and red #961A1C. The burgee is a navy / red / navy stripe
# pattern, so the rule bands repeat it literally rather than inventing a
# motif. The warm sunset stays in the artwork; the type and rules keep to
# the club's two colours.
#
# Rule bands are symmetric: the top band ends 30pt below the page edge,
# the bottom band starts 30pt above it (y 777-812 / 30-65).
cover:
  title: caprera
  title_font: Courier-Bold
  title_size: 30
  title_color: "#1C346E"
  # Title under the art, three equal gaps derived by make-cover.py. The
  # subtitle baseline is fixed at MARGIN + 55 (~83pt), so the art width
  # is what keeps the title clear of it: 380 leaves ~27pt between the
  # title's descender and the subtitle's caps; 400+ starts to crowd it.
  title_below: true
  logo: images/00-cover-art.jpeg
  logo_width: 380
  strip_top: null
  strip_bottom: null
  subtitle: "canzoniere  ·  ukulele"
  subtitle_font: Courier-Bold
  subtitle_size: 13
  subtitle_color: "#961A1C"   # burgee red as the single accent
  rules:
    - { color: "#1C346E", y: 805, height: 7 }
    - { color: "#961A1C", y: 791, height: 7 }
    - { color: "#1C346E", y: 777, height: 7 }
    - { color: "#1C346E", y: 58, height: 7 }
    - { color: "#961A1C", y: 44, height: 7 }
    - { color: "#1C346E", y: 30, height: 7 }

# Presence of `intro:` is what enables the intro page.
intro:
  title: caprera
  title_color: "#1C346E"
  description_size: 13
  description_color: "#1C346E"
  # The Spotify link lives on this page, under the description; the back
  # cover carries none (printing the same QR code twice would add noise).
  spotify: true
  spotify_color: "#1C346E"
  spotify_qr_color: "#1C346E"
  spotify_y: 340   # QR bottom edge: ~40pt under the last description line
  # Printed page: only the locale matching `language:` above is rendered.
  description:
    it:
      - >-
        Il canzoniere del Centro Velico Caprera: canzoni da cantare insieme in
        terrazza.
      - >-
        Cantautori italiani, un po' di pop e rock, qualche pezzo in inglese.
        Ognuno canta come gli viene.
      - Accordi per ukulele, in notazione inglese.
    en:
      - >-
        The songbook of the Centro Velico Caprera: songs to sing together on
        the terrace.
      - >-
        Italian singer-songwriters, some pop and rock, a few songs in English.
        Everyone sings however they sing.
      - Ukulele chords, in English notation.
  rules:
    - { color: "#1C346E", y: 805, height: 7 }
    - { color: "#961A1C", y: 791, height: 7 }
    - { color: "#1C346E", y: 777, height: 7 }
    - { color: "#1C346E", y: 58, height: 7 }
    - { color: "#961A1C", y: 44, height: 7 }
    - { color: "#1C346E", y: 30, height: 7 }

# The back art is narrower than the cover's so the bottom-right corner
# stays free for the automatic Spotify block (QR at x 495-567, y ~109-181,
# URL line at y 88 reaching left to x ~265 for a playlist link). At 360
# the art ends at x 477.6 and y 179.9, so the QR sits beside and below its
# corner without touching it. The caption therefore hangs under the art
# like a photo caption instead of sharing the URL's baseline at y ~83.
back:
  image: images/99-back-cover-art.jpeg
  image_width: 360
  caption: "centro velico caprera"
  caption_font: Courier-Bold
  caption_size: 13
  caption_color: "#1C346E"
  caption_y: 150
  spotify: false
  rules:
    - { color: "#1C346E", y: 805, height: 7 }
    - { color: "#961A1C", y: 791, height: 7 }
    - { color: "#1C346E", y: 777, height: 7 }
    - { color: "#1C346E", y: 58, height: 7 }
    - { color: "#961A1C", y: 44, height: 7 }
    - { color: "#1C346E", y: 30, height: 7 }
