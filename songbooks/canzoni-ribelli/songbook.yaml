slug: canzoni-ribelli
title: Canzoni Ribelli
language: it        # primary language — drives the printed intro page (#36)
notation: latin     # chord names used in the .cho files (DO RE MI …)

blurb: Italian rebel and protest songs

description:
  it: >-
    Canti partigiani e di protesta italiani — inni di resistenza e di lotta,
    tramandati da generazioni di canto collettivo. Si apre con *Fischia il
    vento*, scritta nel 1943 dal comandante partigiano Felice Cascione sulla
    melodia della canzone russa "Katyusha"; diventò uno degli inni più noti
    della Resistenza italiana. Ukulele, accordi in notazione italiana.
  en: >-
    Italian partisan and protest songs — anthems of resistance and struggle,
    passed down through generations of communal singing. Opens with *Fischia il
    vento*, written in 1943 by partisan commander Felice Cascione to the melody
    of the Russian song "Katyusha"; it became one of the best-known anthems of
    the Italian Resistance. Ukulele, Italian chord notation.
