  en: >-
    Songs from the Venice-based Italian indie band Diplomatico e il Collettivo
    Ninco Nanco (active since 2018), drawn from their albums *È tutto un falso*,
    *Ho visto il mondo*, and *Troppe Parole*. Ukulele, English chord notation.

