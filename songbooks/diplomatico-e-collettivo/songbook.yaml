language: it        # primary language — drives the printed intro page (#36)
notation: common    # chord names used in the .cho files (C D E …)

blurb: È tutto un falso, Ho visto il mondo, Troppe Parole

description:
  it: >-
    Canzoni di Diplomatico e il Collettivo Ninco Nanco, band indie italiana di
    Venezia attiva dal 2018, tratte dagli album *È tutto un falso*, *Ho visto
