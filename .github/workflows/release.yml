name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history for tags

      - name: Install ChordPro and fonts
        run: |
          curl -fsSL -o chordpro.AppImage \
            https://github.com/ChordPro/chordpro/releases/download/R6.101.0/ChordPro-6.101.0-wk4.0.AppImage
          chmod +x chordpro.AppImage
          ./chordpro.AppImage --appimage-extract
          EXTRACT_DIR="$PWD/squashfs-root"
          printf '#!/bin/sh\nexec "%s/AppRun" chordpro "$@"\n' "$EXTRACT_DIR" \
            | sudo tee /usr/local/bin/chordpro > /dev/null
          sudo chmod +x /usr/local/bin/chordpro
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer ghostscript
          sudo fc-cache -f
          pip install Pillow reportlab PyYAML

      - name: Compile all songbooks
        run: make all

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Spotify links to release notes
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.new_release_git_tag }}"
          # `links` reads only the committed manifest — no network, no secrets.
          LINKS="$(python3 scripts/spotify_playlists.py links)"
          if [ -n "$LINKS" ]; then
            gh release view "$TAG" --json body -q .body > release-notes.md
            printf '\n%s\n' "$LINKS" >> release-notes.md
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "No resolved Spotify links yet — release notes unchanged."
          fi

      - name: Install Hugo
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail
          HUGO_VERSION="0.165.0"
          curl -fsSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Generate site data
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          python3 scripts/site-data.py --version "${{ steps.release.outputs.new_release_git_tag }}"

      - name: Build Hugo site
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          hugo --source site --minify

      - name: Upload site artifact
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

      - name: Report release
        run: |
          if [ "${{ steps.release.outputs.new_release_published }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.new_release_git_tag }}"
          else
            echo "No release cut for this push."
          fi

  deploy-site:
    name: Deploy site to GitHub Pages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
