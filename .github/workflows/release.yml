name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history for tags

      - name: Install ChordPro and fonts
        run: |
          curl -fsSL -o chordpro.AppImage \
            https://github.com/ChordPro/chordpro/releases/download/R6.101.0/ChordPro-6.101.0-wk4.0.AppImage
          chmod +x chordpro.AppImage
          ./chordpro.AppImage --appimage-extract
          EXTRACT_DIR="$PWD/squashfs-root"
          printf '#!/bin/sh\nexec "%s/AppRun" chordpro "$@"\n' "$EXTRACT_DIR" \
            | sudo tee /usr/local/bin/chordpro > /dev/null
          sudo chmod +x /usr/local/bin/chordpro
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer ghostscript
          sudo fc-cache -f
          pip install Pillow reportlab

      - name: Compile all songbooks
        run: make all

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report release
        run: |
          if [ "${{ steps.release.outputs.new_release_published }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.new_release_git_tag }}"
          else
            echo "No release cut for this push."
          fi
