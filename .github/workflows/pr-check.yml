name: PR Check

on:
  pull_request:
    paths:
      - "songbooks/**"
      - "chordpro-ukulele.json"
      - "scripts/make-cover.py"
      - "scripts/songbook_meta.py"
      - "Makefile"
      - ".github/workflows/pr-check.yml"
      - "scripts/spotify_playlists.py"
      - "scripts/check-site-variants.py"

jobs:
  compile:
    name: Compile changed songbooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changed-file detection needs the base commit

      - name: Install ChordPro
        run: |
          curl -fsSL -o chordpro.AppImage \
            https://github.com/ChordPro/chordpro/releases/download/R6.101.0/ChordPro-6.101.0-wk4.0.AppImage
          chmod +x chordpro.AppImage
          ./chordpro.AppImage --appimage-extract
          EXTRACT_DIR="$PWD/squashfs-root"
          printf '#!/bin/sh\nexec "%s/AppRun" chordpro "$@"\n' "$EXTRACT_DIR" \
            | sudo tee /usr/local/bin/chordpro > /dev/null
          sudo chmod +x /usr/local/bin/chordpro
          chordpro --version
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer ghostscript
          sudo fc-cache -f
          pip install Pillow reportlab PyYAML

      - name: Detect changed songbooks
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # A change to the build machinery (or to this workflow) affects
          # every songbook, so compile the lot.
          if echo "$CHANGED" | grep -qE '^(Makefile|scripts/make-cover\.py|scripts/songbook_meta\.py|chordpro-ukulele\.json|\.github/workflows/pr-check\.yml)$'; then
            echo "Build machinery changed — compiling all songbooks."
            echo "slugs=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUGS=$(echo "$CHANGED" \
            | grep '^songbooks/' \
            | cut -d/ -f2 \
            | sort -u \
            | tr '\n' ' ' || true)
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Compile songbooks
        env:
          SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          set -euo pipefail
          if [ -z "$SLUGS" ]; then
            echo "No songbook content changed — nothing to compile."
            exit 0
          fi
          if [ "$SLUGS" = "all" ]; then
            make all
          else
            for slug in $SLUGS; do
              echo "Compiling $slug..."
              make "$slug"
            done
          fi
          echo "Built PDFs:"
          ls -la pdf/

  site-variants:
    name: Check site variants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check .site.cho variants against their originals
        run: |
          set -euo pipefail
          python3 scripts/check-site-variants.py || {
            EXIT_CODE=$?
            echo "::error::A songbooks/*/*.site.cho variant diverges from its original beyond the permitted differences (extra inline chords, choruses written out in full). The original always has precedence on correctness — re-sync the variant to it using the diff above."
            exit $EXIT_CODE
          }

  spotify-validate:
    name: Validate Spotify manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Validate Spotify manifest
        run: |
          set -euo pipefail
          python3 scripts/spotify_playlists.py validate || {
            EXIT_CODE=$?
            echo "::error::A songbooks/*/spotify.yaml manifest is malformed (bad YAML shape or invalid URI). Fix the entries listed above by hand, or run 'make spotify-resolve' locally and commit the result."
            exit $EXIT_CODE
          }
